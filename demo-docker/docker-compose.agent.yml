# ======================================================================
# Docker Compose — Agente + Base de Datos en Laptop (Conecta al VPS)
# ======================================================================
# USO: Despliega un Agente y BD independientes en tu laptop que se conectan al VPS.
# Puede correr SIMULTÁNEAMENTE con docker-compose.local.yml sin ningún conflicto.
#
# Despliegue:
#   docker compose -f docker-compose.agent.yml up -d --build
# ======================================================================

services:
  # Base de Datos dedicada para la conexión VPS
  db_vps:
    image: postgres:15-alpine
    container_name: demo-vps-database
    environment:
      POSTGRES_DB: tesis_demo_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: demo-tesis-db-2026
    volumes:
      - ./db-init:/docker-entrypoint-initdb.d:ro
    expose:
      - "5432"
    restart: unless-stopped

  # Agente On-Premise dedicado para el VPS
  agent_vps:
    build:
      context: ../agent
      dockerfile: Dockerfile
    container_name: demo-vps-agent
    depends_on:
      - db_vps
    volumes:
      - ./agent-config/config.vps.json:/app/config.json:ro
      - ./agent-config/queries.demo.json:/app/queries.json:ro
    restart: unless-stopped
